name: יצירת שחרור והורדת ZIP (Release ZIP)

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: "בחר גרסה לייצור והורדה:"
        required: true
        type: choice
        default: "בטא 4.92 (Beta 4.92 - פיצ'רים חדשים: שליחת SMS, לא-נקרא, תזכורות)"
        options:
          - "בטא 4.92 (Beta 4.92 - פיצ'רים חדשים: שליחת SMS, לא-נקרא, תזכורות)"
          - "בטא 4.65 (Beta 4.65 - שיפורי תשתית, מטמון ותיקוני באגים)"
          - "רגיל (Stable 4.6 - קבצי המאגר המקוריים)"

permissions:
  contents: write

jobs:
  build-and-release:
    name: הכנת קובץ ZIP ושחרור
    runs-on: ubuntu-latest
    steps:
      - name: בדיקה ומשיכת קבצי המאגר (Checkout)
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: משיכת תגיות קודמות (Fetch all tags)
        run: |
          git fetch --tags --force || true

      - name: וידוא כלי דחיסה (Ensure ZIP tool)
        run: |
          if ! command -v zip &> /dev/null; then
            echo "Installing zip..."
            sudo apt-get update -qq && sudo apt-get install -y zip
          fi

      - name: קביעת גרסה ושמות קבצים (Setup Metadata)
        id: prep
        run: |
          CHOICE="${{ github.event.inputs.release_target }}"
          echo "Selected choice: $CHOICE"

          if [[ "$CHOICE" == *"4.92"* ]]; then
            IS_BETA="true"
            SOURCE_DIR="beta"
            MANIFEST_PATH="beta/manifest.json"
          elif [[ "$CHOICE" == *"4.65"* ]]; then
            IS_BETA="true"
            SOURCE_DIR="beta-4.65"
            MANIFEST_PATH="beta-4.65/manifest.json"
          else
            IS_BETA="false"
            SOURCE_DIR="."
            MANIFEST_PATH="manifest.json"
          fi

          # חילוץ גרסה חסין שגיאות מקובץ המניפסט
          BASE_VERSION=""
          if [ -f "$MANIFEST_PATH" ]; then
            BASE_VERSION=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' "$MANIFEST_PATH" | head -n 1 | cut -d'"' -f4)
          fi

          if [ -z "$BASE_VERSION" ]; then
            if [[ "$CHOICE" == *"4.92"* ]]; then
              BASE_VERSION="4.92"
            elif [[ "$CHOICE" == *"4.65"* ]]; then
              BASE_VERSION="4.65"
            else
              BASE_VERSION="4.6"
            fi
          fi

          echo "Base version determined: $BASE_VERSION"

          # מציאת תגית פנויה
          if [ "$IS_BETA" = "true" ]; then
            TAG_PREFIX="v${BASE_VERSION}-beta"
            if git tag -l | grep -Fxq "$TAG_PREFIX"; then
              echo "Tag $TAG_PREFIX already exists. Searching for next sub-version..."
              SAFE_BASE=$(echo "$BASE_VERSION" | sed 's/\./\\./g')
              LATEST_SUB=$(git tag -l | grep -E "^v${SAFE_BASE}\.[0-9]+-beta$" | sort -V | tail -n 1)

              if [ -z "$LATEST_SUB" ]; then
                FINAL_VERSION="${BASE_VERSION}.1"
              else
                SUB_NUM=$(echo "$LATEST_SUB" | sed 's/-beta$//' | awk -F. '{print $NF}')
                NEXT_SUB=$((SUB_NUM + 1))
                FINAL_VERSION="${BASE_VERSION}.${NEXT_SUB}"
              fi
            else
              FINAL_VERSION="$BASE_VERSION"
            fi

            FINAL_TAG="v${FINAL_VERSION}-beta"
            RELEASE_NAME="PushBox v${FINAL_VERSION} (גרסת בטא)"
            ZIP_NAME="PushBox-v${FINAL_VERSION}-Beta.zip"
            PRERELEASE="true"
          else
            TAG_PREFIX="v${BASE_VERSION}"
            if git tag -l | grep -Fxq "$TAG_PREFIX"; then
              echo "Tag $TAG_PREFIX already exists. Searching for next sub-version..."
              SAFE_BASE=$(echo "$BASE_VERSION" | sed 's/\./\\./g')
              LATEST_SUB=$(git tag -l | grep -E "^v${SAFE_BASE}\.[0-9]+$" | sort -V | tail -n 1)

              if [ -z "$LATEST_SUB" ]; then
                FINAL_VERSION="${BASE_VERSION}.1"
              else
                SUB_NUM=$(echo "$LATEST_SUB" | awk -F. '{print $NF}')
                NEXT_SUB=$((SUB_NUM + 1))
                FINAL_VERSION="${BASE_VERSION}.${NEXT_SUB}"
              fi
            else
              FINAL_VERSION="$BASE_VERSION"
            fi

            FINAL_TAG="v${FINAL_VERSION}"
            RELEASE_NAME="PushBox v${FINAL_VERSION} (גרסה רשמית)"
            ZIP_NAME="PushBox-v${FINAL_VERSION}.zip"
            PRERELEASE="false"
          fi

          echo "IS_BETA=$IS_BETA" >> $GITHUB_OUTPUT
          echo "SOURCE_DIR=$SOURCE_DIR" >> $GITHUB_OUTPUT
          echo "MANIFEST_PATH=$MANIFEST_PATH" >> $GITHUB_OUTPUT
          echo "FINAL_VERSION=$FINAL_VERSION" >> $GITHUB_OUTPUT
          echo "FINAL_TAG=$FINAL_TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "PRERELEASE=$PRERELEASE" >> $GITHUB_OUTPUT

          echo "Configured: Tag=$FINAL_TAG, File=$ZIP_NAME, Source=$SOURCE_DIR"

      - name: דחיסת קובץ ה-ZIP (Create ZIP Archive)
        run: |
          ZIP_NAME="${{ steps.prep.outputs.ZIP_NAME }}"
          SOURCE_DIR="${{ steps.prep.outputs.SOURCE_DIR }}"
          IS_BETA="${{ steps.prep.outputs.IS_BETA }}"

          rm -f "$ZIP_NAME"

          if [ "$IS_BETA" = "true" ]; then
            echo "Packing beta folder $SOURCE_DIR into $ZIP_NAME..."
            if [ -d "$SOURCE_DIR" ]; then
              (cd "$SOURCE_DIR" && zip -q -r "../$ZIP_NAME" . -x "*.git*")
            else
              echo "ERROR: Directory $SOURCE_DIR not found!"
              exit 1
            fi
          else
            echo "Packing stable files into $ZIP_NAME..."
            zip -q -r "$ZIP_NAME" manifest.json popup.html popup.js options.html options.js filters.html filters.js background.js offscreen.html offscreen.js icon16.png icon48.png icon128.png
          fi

          if [ ! -f "$ZIP_NAME" ]; then
            echo "Fallback packaging using python..."
            if [ "$IS_BETA" = "true" ]; then
              python3 -c "import zipfile, os; z = zipfile.ZipFile('$ZIP_NAME', 'w', zipfile.ZIP_DEFLATED); [z.write(os.path.join(root, f), os.path.relpath(os.path.join(root, f), '$SOURCE_DIR')) for root, _, files in os.walk('$SOURCE_DIR') for f in files if not f.startswith('.git')]"
            else
              python3 -c "import zipfile; z = zipfile.ZipFile('$ZIP_NAME', 'w', zipfile.ZIP_DEFLATED); [z.write(f) for f in ['manifest.json', 'popup.html', 'popup.js', 'options.html', 'options.js', 'filters.html', 'filters.js', 'background.js', 'offscreen.html', 'offscreen.js', 'icon16.png', 'icon48.png', 'icon128.png']]"
            fi
          fi

          echo "ZIP Archive created successfully:"
          ls -lh "$ZIP_NAME"

      # העלאת ה-ZIP כ-Artifact להורדה ישירה מתוך ה-Action (ללא תלות ב-Releases)
      - name: העלאת ה-ZIP כתוצר להורדה בלחיצה אחת (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.ZIP_NAME }}
          path: ${{ steps.prep.outputs.ZIP_NAME }}
          retention-days: 90

      # חילוץ הערות שחרור
      - name: הכנת הערות שחרור (Release Notes)
        id: notes
        run: |
          RELEASE_TAG="${{ steps.prep.outputs.FINAL_TAG }}"
          IS_BETA="${{ steps.prep.outputs.IS_BETA }}"
          
          if [ "$IS_BETA" = "true" ]; then
            BODY="הורדת חבילת תוסף PushBox גרסת בטא ($RELEASE_TAG). יש לפרוק את קובץ ה-ZIP ולטעון בכרום (Load unpacked)."
          else
            BODY="הורדת חבילת תוסף PushBox גרסה רשמית ($RELEASE_TAG). יש לפרוק את קובץ ה-ZIP ולטעון בכרום (Load unpacked)."
          fi

          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "$BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # פרסום ב-Releases (אם יש הרשאות כתיבה למאגר; ממשיך גם אם חסרה הרשאה)
      - name: פרסום ב-GitHub Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: "${{ steps.prep.outputs.FINAL_TAG }}"
          name: "${{ steps.prep.outputs.RELEASE_NAME }}"
          body: "${{ env.RELEASE_BODY }}"
          files: "${{ steps.prep.outputs.ZIP_NAME }}"
          prerelease: ${{ steps.prep.outputs.PRERELEASE == 'true' }}
          make_latest: ${{ steps.prep.outputs.IS_BETA != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
