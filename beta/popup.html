<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>הודעות SMS - PushBox בטא 4.92</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --bg: #faf5ff;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e9d5ff;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Hebrew, sans-serif;
      width: 380px;
      height: 560px; 
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
      direction: rtl;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      width: 100%;
    }

    .logo-container { text-align: right; }
    .app-icon { width: 24px; height: 24px; object-fit: contain; vertical-align: middle; }

    .app-title-wrap {
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .app-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.5px;
      margin: 0;
    }

    .beta-badge {
      background: #f3e8ff;
      color: #6b21a8;
      border: 1px solid #d8b4fe;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 6px;
    }

    .system-phone-container {
      text-align: left;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }
    #systemPhone { direction: ltr; display: inline-block; }

    .actions-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .actions-row-2 {
      display: flex;
      gap: 6px;
      width: 100%;
      align-items: center;
    }

    .search-input {
      flex: 1;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 12px;
      background: #ffffff;
      outline: none;
      transition: all 0.2s ease;
      min-width: 0;
    }
    .search-input:focus { 
      border-color: #c084fc; 
      box-shadow: 0 0 0 2px rgba(192, 132, 252, 0.15);
    }

    .icon-btn {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 2px;
      font-size: 11px;
      cursor: pointer;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s ease;
      text-decoration: none;
      font-weight: 600;
      width: 100%;
    }

    .icon-btn:hover {
      background: #f3e8ff;
      color: var(--primary);
      border-color: #d8b4fe;
    }

    .icon-btn.active {
      background: #f3e8ff;
      border-color: #c084fc;
      color: #6b21a8;
      box-shadow: inset 0 1px 2px rgba(107, 33, 168, 0.1);
    }

    .btn-square { 
      width: 32px; 
      height: 32px;
      flex-shrink: 0; 
      padding: 0; 
    }

    .btn-filter-tab {
      padding: 7px 6px;
      font-size: 11px;
      flex-shrink: 0;
      width: auto;
    }

    .svg-icon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .spinning { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(-360deg); } }

    /* פאנל שליחת SMS בעיצוב תואם מלא */
    #sendSmsPanel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-top: 10px;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(107, 33, 168, 0.06);
      flex-shrink: 0;
    }

    .sms-panel-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sms-close-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 2px;
      border-radius: 4px;
    }
    .sms-close-btn:hover { color: #6b21a8; background: #f3e8ff; }

    .sms-input {
      width: 100%;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 12px;
      background: #faf5ff;
      outline: none;
      transition: border-color 0.2s;
    }
    .sms-input:focus {
      border-color: #c084fc;
      background: #fff;
    }

    .sms-textarea {
      width: 100%;
      height: 52px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 12px;
      background: #faf5ff;
      outline: none;
      resize: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .sms-textarea:focus {
      border-color: #c084fc;
      background: #fff;
    }

    .sms-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .sms-counter {
      font-size: 11px;
      color: var(--text-muted);
    }

    .btn-sms-submit {
      background: #f3e8ff;
      color: var(--primary);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    .btn-sms-submit:hover {
      background: #e9d5ff;
      color: #1e3a8a;
      border-color: #c084fc;
    }

    .sms-status-msg {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      display: none;
    }
    .sms-status-msg.success { background: #dcfce7; color: #166534; }
    .sms-status-msg.error { background: #fee2e2; color: #991b1b; }

    /* פסי סטטוס וסל מחזור */
    #statusBanner {
      display: none;
      text-align: center;
      color: #6b21a8;
      font-weight: 700;
      font-size: 12px;
      margin: 8px 0 0 0;
      background: #f3e8ff;
      padding: 6px;
      border-radius: 6px;
      border: 1px dashed #d8b4fe;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
    }

    @keyframes pulse-purple {
      0% { box-shadow: 0 0 0 0 rgba(107, 33, 168, 0.6); }
      70% { box-shadow: 0 0 0 6px rgba(107, 33, 168, 0); }
      100% { box-shadow: 0 0 0 0 rgba(107, 33, 168, 0); }
    }

    .update-alert-box {
      display: none;
      text-align: center;
      background: #6b21a8;
      color: white;
      padding: 8px;
      border-radius: var(--radius);
      margin: 8px 0 0 0;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      animation: pulse-purple 2s infinite;
      flex-shrink: 0;
    }
    .update-alert-box:hover {
      background: #581c87;
    }

    #messagesList {
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
      margin-top: 10px;
    }
    #messagesList::-webkit-scrollbar { width: 5px; }
    #messagesList::-webkit-scrollbar-thumb { background: #d8b4fe; border-radius: 4px; }

    .msg-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px;
      margin-bottom: 10px;
      border-radius: var(--radius);
      box-shadow: 0 1px 3px rgba(107, 33, 168, 0.04);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      position: relative;
    }
    .msg-card:hover { box-shadow: 0 4px 12px rgba(107, 33, 168, 0.08); }

    /* עיצוב להודעה שלא נקראה */
    .msg-card.is-unread {
      border-color: #c084fc;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(107, 33, 168, 0.08);
    }
    .msg-card.is-unread::before {
      content: "";
      position: absolute;
      top: 12px;
      right: -4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6b21a8;
      box-shadow: 0 0 0 2px #ffffff;
    }

    .msg-header {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .msg-source-wrapper { text-align: right; display: flex; align-items: center; gap: 6px; }
    .msg-source {
      background: #f3e8ff;
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 11px;
      display: inline-block;
    }
    .msg-snooze-tag {
      background: #e0e7ff;
      color: #3730a3;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .msg-controls {
      display: flex;
      gap: 3px;
      justify-self: center;
      align-items: center;
    }
    .msg-date-wrapper { text-align: left; }
    .msg-date { font-size: 11px; }

    .ctrl-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 3px 4px;
      border-radius: 4px;
      transition: all 0.2s ease;
      opacity: 0.65;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ctrl-btn:hover { background: #f3e8ff; color: var(--primary); opacity: 1; }
    .ctrl-btn.active { color: #6b21a8; opacity: 1; background: #f3e8ff; }

    /* פופאובר בחירת זמן Snooze */
    .snooze-popover {
      display: none;
      position: absolute;
      top: 36px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 6px 16px rgba(107, 33, 168, 0.12);
      padding: 6px;
      z-index: 50;
      width: 140px;
      flex-direction: column;
      gap: 4px;
    }
    .snooze-opt-btn {
      background: none;
      border: none;
      text-align: right;
      padding: 6px 8px;
      font-size: 11px;
      color: var(--text);
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .snooze-opt-btn:hover {
      background: #f3e8ff;
      color: var(--primary);
    }

    .msg-body {
      font-size: 13px;
      color: var(--text);
      word-break: break-word;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .msg-body.collapsed {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .btn-copy {
      background: #f3e8ff;
      color: #1e3a8a;
      border: 1px solid #d8b4fe;
      padding: 0 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      width: 100%;
      height: 34px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-sizing: border-box;
    }
    .btn-copy:hover { background: #e9d5ff; }
    .btn-copy .code-highlight {
      color: #6b21a8;
      font-weight: 800;
    }
    .copy-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .loading, .error, .empty {
      text-align: center;
      padding: 30px 15px;
      font-size: 13px;
      border-radius: var(--radius);
      border: 1px dashed var(--border);
      font-weight: 600;
    }
    .loading { color: var(--text-muted); background: var(--surface); }
    .error, .empty { color: #6b21a8; background: #f3e8ff; border-color: #d8b4fe; }
  </style>
</head>
<body>
  <div class="header">
    
    <div class="top-bar">
      <div class="logo-container">
        <img src="icon48.png" alt="לוגו" class="app-icon">
      </div>
      <div class="app-title-wrap">
        <h1 class="app-title">PushBox</h1>
        <span class="beta-badge">4.92 בטא</span>
      </div>
      <div class="system-phone-container">
        <span id="systemPhone"></span>
      </div>
    </div>

    <!-- שורת פעולות ראשית -->
    <div class="actions-grid">
      <a href="options.html" target="_blank" class="icon-btn" title="הגדרות תוסף וערוצי עדכון">
        <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        הגדרות
      </a>
      <button id="refreshBtn" class="icon-btn" title="רענן הודעות כעת">
        <svg id="refreshIcon" class="svg-icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        רענן
      </button>
      <button id="toggleSmsBtn" class="icon-btn" title="פתח/סגור חלון שליחת SMS">
        <svg class="svg-icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        שליחה
      </button>
      <button id="resendBtn" class="icon-btn" title="שלח התראת דחיפה להודעה האחרונה">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        פוש
      </button>
    </div>

    <!-- שורת חיפוש ולחצני תצוגה -->
    <div class="actions-row-2">
      <input type="text" id="searchInput" class="search-input" placeholder="חפש בהודעות...">
      <button id="unreadFilterBtn" class="icon-btn btn-filter-tab" title="הצג רק הודעות שלא נקראו">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        לא נקרא
      </button>
      <button id="snoozeFilterBtn" class="icon-btn btn-filter-tab" title="הצג הודעות לטיפול בהמשך">
        <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        להמשך
      </button>
      <button id="toggleAllBtn" class="icon-btn btn-square" title="צמצם/הרחב הכל">
        <svg class="svg-icon toggle-all-icon" viewBox="0 0 24 24"><polyline points="7 15 12 20 17 15"></polyline><polyline points="7 9 12 4 17 9"></polyline></svg>
      </button>
      <button id="trashBtn" class="icon-btn btn-square" title="סל מחזור (הודעות שנמחקו)">
        <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </button>
    </div>

  </div>

  <!-- פאנל שליחת SMS מתקפל -->
  <div id="sendSmsPanel">
    <div class="sms-panel-title">
      <span>שליחת הודעת SMS חדשה</span>
      <button id="closeSmsPanelBtn" class="sms-close-btn" title="סגור חלונית">
        <svg class="svg-icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <input type="text" id="smsDestination" class="sms-input" placeholder="מספר יעד (לדוגמה: 0501234567)">
    <textarea id="smsMessage" class="sms-textarea" placeholder="תוכן ההודעה..."></textarea>
    <div class="sms-footer">
      <span id="smsCharCounter" class="sms-counter">0 תווים</span>
      <button id="sendSmsSubmitBtn" class="btn-sms-submit">
        <svg class="svg-icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        שלח SMS
      </button>
    </div>
    <div id="smsStatusMsg" class="sms-status-msg"></div>
  </div>

  <!-- פס התראה למצב סל מחזור / סינון פעיל -->
  <div id="statusBanner">
    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
    <span id="statusBannerText">סל מחזור פעיל (הודעות שנמחקו)</span>
  </div>

  <div id="updateAlertBox" class="update-alert-box">
    עדכון גרסה זמין! לחץ כאן להורדה
  </div>

  <div id="messagesList">
    <div class="loading">טוען הודעות...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
